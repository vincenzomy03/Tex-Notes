name: Release Tex-Notes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Download Bundled Tectonic Engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          Invoke-WebRequest -Uri "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-pc-windows-msvc.zip" -OutFile "bin/tectonic.zip"
          Expand-Archive -Path "bin/tectonic.zip" -DestinationPath "bin" -Force
          Remove-Item "bin/tectonic.zip" -Force
          Test-Path "bin/tectonic.exe"

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Prepare Portable ZIP Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable/Tex-Notes/bin"
          Copy-Item "src-tauri/target/release/tex-notes.exe" "portable/Tex-Notes/Tex-Notes.exe"
          Copy-Item "bin/tectonic.exe" "portable/Tex-Notes/tectonic.exe"
          Copy-Item "bin/tectonic.exe" "portable/Tex-Notes/bin/tectonic.exe"
          Compress-Archive -Path "portable/Tex-Notes" -DestinationPath "Tex-Notes-windows-portable.zip" -Force

      - name: Collect Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts"
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include "*.exe", "*.msi" | Copy-Item -Destination "artifacts"
          Copy-Item "Tex-Notes-windows-portable.zip" "artifacts/"
          Get-ChildItem -Path "artifacts" | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: Tex-Notes ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
