[package]
name = "tex-notes"
version = "1.0.3"
description = "A minimal, offline LaTeX note-taking app with live preview and PDF export"
edition = "2021"

[lib]
name = "tex_notes_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
regex = "1.10"
tempfile = "3.10"
